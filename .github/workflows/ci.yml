name: Documentation and backlog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Links, requirements, and issue drafts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Markdown links and required files
        run: python3 scripts/check-docs.py

      - name: Validate issue frontmatter and requirement coverage
        run: python3 scripts/validate-backlog.py

      - name: Smoke-test the dry-run scripts
        run: |
          ./scripts/sync-labels.sh --dry-run >/dev/null
          ./scripts/create-issues.sh --dry-run >/dev/null
