name: PR metadata
on:
  pull_request_target:
    types: [opened, edited, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync linked issue labels and milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          issue=$(printf '%s' "$PR_BODY" | grep -oiE '(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)[[:space:]]*#[0-9]+' | grep -oE '#[0-9]+' | head -n 1 | tr -d '#' || true)
          if [ -z "$issue" ]; then
            echo "No linked issue found."
            exit 0
          fi
          if ! gh issue view "$issue" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Issue #$issue does not exist."
            exit 0
          fi
          args=(pr edit "$PR_NUMBER" --repo "$REPOSITORY")
          while IFS= read -r label; do
            [ -n "$label" ] && args+=(--add-label "$label")
          done < <(gh issue view "$issue" --repo "$REPOSITORY" --json labels --jq '.labels[].name')
          milestone=$(gh issue view "$issue" --repo "$REPOSITORY" --json milestone --jq '.milestone.title // empty')
          if [ -n "$milestone" ]; then args+=(--milestone "$milestone"); fi
          gh "${args[@]}"
