name: Feature request
description: Propose a user-visible capability or a product change.
title: "[Feature]: "
labels:
  - "type/feature"
  - "status/needs-design"
body:
  - type: markdown
    attributes:
      value: |
        Marsa 0.1 is deliberately narrow: one Linux host, one service per deployment,
        PostgreSQL, Caddy, and no Compose import. Explain how the proposal fits.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the problem, when does it occur, and what do they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible flow, not the implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include doing nothing and using an existing tool.
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Related requirement IDs
      description: "Optional. Example: requirement ID."
  - type: dropdown
    id: scope
    attributes:
      label: Scope check
      options:
        - Fits the 0.1 MVP
        - Post-MVP
        - Unsure
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This does not require multi-service, multi-host, or Compose support in 0.1.
          required: true
        - label: I searched existing issues and ADRs first.
          required: true
