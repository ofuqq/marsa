# Marsa label taxonomy. Keep names stable: issue templates and automation refer to them.
# Apply with: ./scripts/sync-labels.sh --dry-run   (or --apply)
- name: "type/feature"
  color: "1D76DB"
  description: "New user-visible capability"
- name: "type/bug"
  color: "D73A4A"
  description: "Incorrect or unsafe behavior"
- name: "type/task"
  color: "5319E7"
  description: "Engineering, tooling, or maintenance work"
- name: "type/docs"
  color: "0075CA"
  description: "Documentation and diagrams"
- name: "type/security"
  color: "B60205"
  description: "Security control, hardening, or review"
- name: "type/infra"
  color: "0052CC"
  description: "Build, CI, packaging, or release infrastructure"
- name: "area/platform"
  color: "C5DEF5"
  description: "Solution, configuration, composition, health"
- name: "area/auth"
  color: "C5DEF5"
  description: "Setup, identity, sessions, roles, tokens"
- name: "area/projects"
  color: "C5DEF5"
  description: "Projects, environments, and settings"
- name: "area/source"
  color: "C5DEF5"
  description: "Git sources, credentials, webhooks"
- name: "area/detection"
  color: "C5DEF5"
  description: "Stack detection and marsa.json"
- name: "area/build"
  color: "C5DEF5"
  description: "Build pipeline, images, BuildKit"
- name: "area/runtime"
  color: "C5DEF5"
  description: "Container lifecycle, limits, health"
- name: "area/deploy"
  color: "C5DEF5"
  description: "Admission, state machine, worker, rollback"
- name: "area/edge"
  color: "C5DEF5"
  description: "Caddy, routes, domains, TLS"
- name: "area/observability"
  color: "C5DEF5"
  description: "Logs, events, metrics, tracing"
- name: "area/secrets"
  color: "C5DEF5"
  description: "Encryption, secret versions, environment"
- name: "area/security"
  color: "C5DEF5"
  description: "Authorization, validation, isolation, hardening"
- name: "area/reliability"
  color: "C5DEF5"
  description: "Leases, recovery, reconciliation, invariants"
- name: "area/release"
  color: "C5DEF5"
  description: "Versioning, artifacts, SBOM, release gates"
- name: "area/audit"
  color: "C5DEF5"
  description: "Audit trail and visibility"
- name: "area/cli"
  color: "C5DEF5"
  description: "Marsa command line"
- name: "area/ui"
  color: "C5DEF5"
  description: "Razor Components, Arabic, accessibility"
- name: "area/api"
  color: "C5DEF5"
  description: "HTTP contract, OpenAPI, ProblemDetails"
- name: "area/ops"
  color: "C5DEF5"
  description: "Install, upgrade, backup, diagnostics"
- name: "area/testing"
  color: "C5DEF5"
  description: "Test infrastructure and coverage"
- name: "area/docs"
  color: "C5DEF5"
  description: "Documentation, runbooks, ADRs"
- name: "priority/p0"
  color: "B60205"
  description: "Blocks the MVP or a security gate"
- name: "priority/p1"
  color: "D93F0B"
  description: "Required for the MVP but not the first blocker"
- name: "priority/p2"
  color: "FBCA04"
  description: "Valuable, can follow the MVP path"
- name: "priority/p3"
  color: "C2E0C6"
  description: "Nice to have or post-MVP"
- name: "status/ready"
  color: "0E8A16"
  description: "Scoped, unblocked, ready to implement"
- name: "status/blocked"
  color: "B60205"
  description: "Waiting on a dependency or decision"
- name: "status/needs-design"
  color: "FBCA04"
  description: "Needs a design or ADR before coding"
- name: "status/needs-review"
  color: "FBCA04"
  description: "Needs maintainer review"
- name: "size/xs"
  color: "EDEDED"
  description: "Under half a day"
- name: "size/s"
  color: "EDEDED"
  description: "About one day"
- name: "size/m"
  color: "EDEDED"
  description: "Two to three days"
- name: "size/l"
  color: "EDEDED"
  description: "Four to seven days"
- name: "size/xl"
  color: "EDEDED"
  description: "Needs splitting before implementation"
- name: "good-first-issue"
  color: "7057FF"
  description: "Small, well-bounded contribution"
- name: "help-wanted"
  color: "008672"
  description: "Maintainers welcome outside help"
