services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marsa}
      POSTGRES_DB: ${POSTGRES_DB:-marsa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marsa} -d ${POSTGRES_DB:-marsa}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile.template:/etc/caddy/Caddyfile:ro
      - caddy_run:/run/marsa/caddy
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Marsa__Database__ConnectionString: Host=postgres;Port=5432;Database=marsa;Username=${POSTGRES_USER:-marsa};Password=${POSTGRES_PASSWORD:-marsa}
      Marsa__Edge__CaddyAdminSocket: /run/marsa/caddy/admin.sock
      Marsa__Security__MasterKeyPath: /var/lib/marsa/master.key
      Marsa__PublicBaseUrl: ${MARSA_PUBLIC_BASE_URL:-http://localhost}
      Marsa__Docker__SocketPath: /var/run/docker.sock
    volumes:
      - server_data:/var/lib/marsa
      - caddy_run:/run/marsa/caddy
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      caddy:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  caddy_run:
  server_data:
